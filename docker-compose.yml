# Default deployment: the WiFi (http) source with normal bridge networking.
# Copy .env.example to .env and set PITBOSS_HOST / PITBOSS_PASSWORD.
# Try it without a grill:  PITBOSS_SOURCE=fake docker compose up --build
services:
  pitboss-bridge:
    build:
      context: .
      args:
        EXTRAS: http
    image: ghcr.io/iamstevedavis/smoker:latest
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      PITBOSS_SOURCE: ${PITBOSS_SOURCE:-http}
      PITBOSS_MODEL: ${PITBOSS_MODEL:-PB850PS2}
      PITBOSS_HOST: ${PITBOSS_HOST:-}
      PITBOSS_PASSWORD: ${PITBOSS_PASSWORD:-}
      PITBOSS_DB: /data/pitboss.sqlite
      PITBOSS_POLL_SECONDS: ${PITBOSS_POLL_SECONDS:-2}
      PITBOSS_STALE_AFTER_SECONDS: ${PITBOSS_STALE_AFTER_SECONDS:-30}
    ports:
      - "${PITBOSS_PORT:-8000}:8000"
    volumes:
      - pitboss-data:/data

volumes:
  pitboss-data:
