[project]
name = "smokestack"
version = "0.1.0"
description = "Smokestack: self-hosted dashboard and alerts for Pit Boss pellet grills"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  # The API uses the Pydantic 2 model API (model_dump); FastAPI alone
  # would still allow Pydantic 1.
  "pydantic>=2,<3",
  "uvicorn[standard]>=0.30,<1",
  # Both grill sources ship in every install. pytboss already depends on
  # bleak; it is listed because the BLE source imports it directly.
  # pytboss uses date-based versions, so a `<1` cap would exclude all releases.
  # 2026.8.4 is the first release that ships `pytboss.http`.
  "bleak>=0.22,<1",
  "pytboss>=2026.8.4",
]

[project.optional-dependencies]
mqtt = [
  "aiomqtt>=2,<3",
]
test = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
]

[project.urls]
Source = "https://github.com/iamstevedavis/smokestack"

[project.scripts]
smokestack = "smokestack.__main__:main"

[build-system]
# 77 is the first release that reads the SPDX `license` string.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
smokestack = ["static/*", "static/icons/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated.*",
  "ignore:.*asyncio.get_event_loop_policy.*:DeprecationWarning:pytest_asyncio.plugin",
  "ignore:.*asyncio.set_event_loop_policy.*:DeprecationWarning:pytest_asyncio.plugin",
]
