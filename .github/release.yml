# Groups the notes GitHub generates for each release (see docs/releasing.md).
# A PR lands in the first category whose label it has.
changelog:
  exclude:
    labels: [duplicate, invalid, wontfix]
  categories:
    # First, so a breaking feature or fix is listed here and not lower down.
    - title: Breaking changes
      labels: [breaking]
    - title: Features
      labels: [enhancement]
    - title: Fixes
      labels: [bug]
    - title: Documentation
      labels: [documentation]
    - title: Other changes
      labels: ["*"]
