<!-- @dsCard height=300 -->
<div class="cover">
<style>
.cover{position:relative;width:960px;height:300px;background:var(--color-bg);overflow:hidden;font-family:var(--font-sans)}
.cover svg{position:absolute;left:0;top:0}
.ink{fill:var(--color-ember)}.s1{fill:var(--color-surface-2)}.blue{fill:var(--series-probe-1)}.teal{fill:var(--series-probe-2)}
.rule{stroke:var(--color-border-strong);stroke-width:1}
.set{stroke:var(--color-label-secondary);stroke-width:2;stroke-dasharray:6 6;fill:none}
.r{rx:var(--radius-md)}
.name{position:absolute;left:40px;bottom:64px;margin:0;max-width:440px;font-size:64px;line-height:.95;font-weight:700;letter-spacing:-.04em;color:var(--color-label-primary)}
.tag{position:absolute;left:40px;bottom:32px;margin:0;max-width:440px;font-size:13px;color:var(--color-label-secondary)}
</style>
<svg width="960" height="300" viewBox="0 0 960 300" aria-hidden="true">
<!-- blocks: color-ember 216x260 slab (the grill), color-surface-2 176x128, series-probe-1 176x56, series-probe-2 80x56 -->
<!-- arrangement: one tall ink slab bleeding off the top, satellites to its right in a flush modular grid with space-2 gaps -->
<!-- pattern: five hairline rules (color-border-strong) like a chart grid crossing the blocks, plus the dashed set line in color-label-secondary; the system's identity is a readout over a chart -->
<!-- scales: corners radius-md (8px), gaps space-2 (8px), rule pitch space-12 (48px) -->
<line class="rule" x1="480" y1="48" x2="960" y2="48"/>
<line class="rule" x1="480" y1="96" x2="960" y2="96"/>
<line class="rule" x1="480" y1="144" x2="960" y2="144"/>
<line class="rule" x1="480" y1="192" x2="960" y2="192"/>
<line class="rule" x1="480" y1="240" x2="960" y2="240"/>
<rect class="ink r" x="496" y="-24" width="216" height="260"/>
<rect class="s1 r" x="720" y="40" width="176" height="128"/>
<rect class="blue r" x="720" y="176" width="176" height="56"/>
<rect class="teal r" x="904" y="176" width="80" height="56"/>
<path class="set" d="M480 120 H960"/>
</svg>
<h1 class="name">Smokestack-<br>style</h1>
<p class="tag">High-contrast and monochrome with one ember accent, so the grill reads at a glance.</p>
</div>
