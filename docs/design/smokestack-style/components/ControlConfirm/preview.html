<!-- @dsCard group="Smokestack" height=300 subtitle="Confirming a grill command" -->
<div style="padding: var(--space-8) var(--space-6); background: var(--color-overlay); font-family: var(--font-sans); color: var(--color-label-primary); display: flex; justify-content: center;">
  <div role="alertdialog" aria-labelledby="cc-title" aria-describedby="cc-body" style="width: 420px; background: var(--color-bg); border: var(--border-default); border-radius: var(--radius-lg); box-shadow: var(--shadow-xl);">
    <div style="padding: var(--space-5) var(--space-6) var(--space-4);">
      <h2 id="cc-title" class="heading-5" style="margin: 0 0 var(--space-2);">Turn the grill off?</h2>
      <p id="cc-body" style="margin: 0; font-size: var(--text-14); line-height: 1.6; color: var(--color-label-secondary);">Turn the grill off. The fan will run for about 10 minutes.</p>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-secondary">Cancel</button>
      <button type="button" class="btn btn-danger">Turn off</button>
    </div>
  </div>
</div>
