<!-- @dsCard group="Smokestack" height=220 subtitle="Connection line, component states and error flags" -->
<div style="padding: var(--space-6); background: var(--color-bg); font-family: var(--font-sans); color: var(--color-label-primary); display: flex; flex-direction: column; gap: var(--space-4); max-width: 720px;">
  <div role="status" style="display: flex; align-items: center; gap: var(--space-2); padding: var(--space-2) var(--space-3); background: var(--color-surface-1); border: var(--border-subtle); border-radius: var(--radius-md); font-size: var(--text-13); color: var(--color-label-secondary);">
    <span class="deployment-dot deployment-dot--ready" aria-hidden="true"></span>
    <span style="color: var(--color-label-primary);">Connected over WiFi</span>
    <span>·</span><span class="mono">last reading 2 s ago</span>
  </div>

  <ul aria-label="Components" style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--space-2);">
    <li style="display: flex; align-items: center; justify-content: space-between; padding: var(--space-3); background: var(--color-surface-1); border: var(--border-default); border-radius: var(--radius-md); font-size: var(--text-14);">Power <span class="status-badge status-badge--ready">On</span></li>
    <li style="display: flex; align-items: center; justify-content: space-between; padding: var(--space-3); background: var(--color-surface-1); border: var(--border-default); border-radius: var(--radius-md); font-size: var(--text-14);">Fan <span class="status-badge status-badge--ready">On</span></li>
    <li style="display: flex; align-items: center; justify-content: space-between; padding: var(--space-3); background: var(--color-surface-1); border: var(--border-subtle); border-radius: var(--radius-md); font-size: var(--text-14); color: var(--color-label-secondary);">Igniter <span class="status-badge status-badge--queued">Off</span></li>
    <li style="display: flex; align-items: center; justify-content: space-between; padding: var(--space-3); background: var(--color-surface-1); border: var(--border-subtle); border-radius: var(--radius-md); font-size: var(--text-14); color: var(--color-label-secondary);">Auger <span class="status-badge status-badge--queued">Off</span></li>
  </ul>

  <div style="display: flex; gap: var(--space-2); flex-wrap: wrap;">
    <span class="badge badge--success">No error flags</span>
    <span class="badge badge--warning">Stale: no reading for 45 s</span>
    <span class="badge badge--error">High temp error</span>
  </div>
</div>
