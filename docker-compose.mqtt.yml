# Optional Mosquitto broker for local MQTT / Home Assistant testing.
#   docker compose -f docker-compose.yml -f docker-compose.mqtt.yml --profile mqtt up
# The bridge reaches the broker by its service name on the compose network.
# For Bluetooth, use -f docker-compose.ble.yml in place of docker-compose.yml.
services:
  pitboss-bridge:
    environment:
      PITBOSS_MQTT_HOST: mosquitto
  mosquitto:
    image: eclipse-mosquitto:2
    profiles: ["mqtt"]
    ports:
      - "1883:1883"
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
