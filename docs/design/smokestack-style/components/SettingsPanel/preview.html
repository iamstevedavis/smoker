<!-- @dsCard group="Smokestack" height=560 subtitle="Linear-style section list and setting rows, in the Vercel-style tokens" -->
<div style="padding: var(--space-6); background: var(--color-overlay); font-family: var(--font-sans); color: var(--color-label-primary);">
  <div role="dialog" aria-labelledby="sp-title" style="max-width: 860px; margin: 0 auto; background: var(--color-bg); border: var(--border-default); border-radius: var(--radius-lg); box-shadow: var(--shadow-xl); overflow: hidden; display: flex; flex-direction: column;">
    <div style="display: flex; align-items: center; justify-content: space-between; padding: var(--space-3) var(--space-4) var(--space-3) var(--space-5); border-bottom: var(--border-subtle);">
      <h2 id="sp-title" class="heading-5" style="margin: 0;">Settings</h2>
      <button type="button" class="btn btn-ghost btn-sm">Close</button>
    </div>
    <div style="display: flex; min-height: 380px;">
      <nav aria-label="Settings sections" style="width: 200px; flex-shrink: 0; padding: var(--space-3) var(--space-2); background: var(--color-surface-1); border-right: var(--border-subtle); display: flex; flex-direction: column; gap: 2px;">
        <a class="nav-docs-item active" href="#" aria-current="page" style="justify-content: space-between;"><span>Grill</span><span class="mono" style="font-size: var(--text-12); color: var(--color-label-secondary);">WiFi</span></a>
        <a class="nav-docs-item" href="#" style="justify-content: space-between;"><span>Alerts</span><span class="mono" style="font-size: var(--text-12);">On</span></a>
        <a class="nav-docs-item" href="#" style="justify-content: space-between;"><span>Home Assistant</span><span class="mono" style="font-size: var(--text-12);">Off</span></a>
        <a class="nav-docs-item" href="#" style="justify-content: space-between;"><span>Access &amp; control</span></a>
        <a class="nav-docs-item" href="#"><span>System</span></a>
      </nav>
      <div style="flex: 1; min-width: 0; padding: var(--space-5) var(--space-6);">
        <div role="status" style="display: flex; align-items: center; gap: var(--space-2); font-size: var(--text-13); color: var(--color-label-secondary); margin-bottom: var(--space-5);">
          <span class="deployment-dot deployment-dot--ready" aria-hidden="true"></span><span style="color: var(--color-label-primary);">Connected over WiFi</span> · <span class="mono">2 s ago</span>
        </div>

        <span class="section-label">Connection</span>
        <div style="border: var(--border-default); border-radius: var(--radius-md);">
          <div style="display: flex; align-items: center; gap: var(--space-4); padding: var(--space-3) var(--space-4); border-bottom: var(--border-subtle);">
            <div style="flex: 1;"><div class="form-label">Source</div><div style="font-size: var(--text-12); color: var(--color-label-secondary);">From .env</div></div>
            <div class="tabs" role="radiogroup" aria-label="Source" style="display: inline-flex; gap: 2px; padding: 2px; background: var(--color-surface-2); border-radius: var(--radius-sm);">
              <button type="button" role="radio" aria-checked="true" class="btn btn-sm" style="background: var(--color-bg); color: var(--color-label-primary); box-shadow: var(--shadow-border);">WiFi</button>
              <button type="button" role="radio" aria-checked="false" class="btn btn-ghost btn-sm">Bluetooth</button>
              <button type="button" role="radio" aria-checked="false" class="btn btn-ghost btn-sm">Demo</button>
            </div>
          </div>
          <div style="display: flex; align-items: center; gap: var(--space-4); padding: var(--space-3) var(--space-4); border-bottom: var(--border-subtle);">
            <label for="sp-host" class="form-label" style="flex: 1;">Grill address</label>
            <input id="sp-host" class="input input-mono input-sm" value="192.168.1.40" style="width: 200px;">
          </div>
          <div style="display: flex; align-items: center; gap: var(--space-4); padding: var(--space-3) var(--space-4); border-bottom: var(--border-subtle);">
            <div style="flex: 1; display: flex; align-items: center; gap: var(--space-2);"><label for="sp-model" class="form-label">Model</label><span class="badge">Custom</span><button type="button" class="btn btn-ghost btn-sm" aria-label="Reset model to default">Reset</button></div>
            <input id="sp-model" class="input input-mono input-sm" value="PB1150PS2" style="width: 200px;">
          </div>
          <div style="display: flex; align-items: center; gap: var(--space-4); padding: var(--space-3) var(--space-4);">
            <div class="form-label" style="flex: 1;">Grill password</div>
            <span class="mono" style="color: var(--color-label-secondary);">••••••</span>
            <button type="button" class="btn btn-secondary btn-sm" aria-label="Change grill password">Change</button>
          </div>
        </div>

        <span class="section-label" style="margin-top: var(--space-6);">Access</span>
        <div style="border: var(--border-default); border-radius: var(--radius-md);">
          <div style="display: flex; align-items: center; gap: var(--space-4); padding: var(--space-3) var(--space-4); border-bottom: var(--border-subtle);">
            <div style="flex: 1;"><div class="form-label">Dashboard password</div><div class="form-helper" style="color: var(--color-label-secondary);">A password is needed to open the dashboard.</div></div>
            <label class="toggle" aria-label="Dashboard password"><input type="checkbox" checked><span class="toggle-track"></span><span class="toggle-thumb"></span></label>
          </div>
          <div style="display: flex; align-items: center; gap: var(--space-4); padding: var(--space-3) var(--space-4);">
            <div style="flex: 1;"><div class="form-label">Read the grill every</div></div>
            <input class="input input-mono input-sm" type="number" value="2" aria-label="Poll seconds" style="width: 72px; text-align: right;"><span style="font-size: var(--text-13); color: var(--color-label-secondary);">s</span>
          </div>
        </div>
      </div>
    </div>
    <div class="modal-footer" style="justify-content: space-between; padding: var(--space-3) var(--space-5);">
      <span role="status" style="font-size: var(--text-13); color: var(--color-warning);">1 unsaved change</span>
      <div style="display: flex; gap: var(--space-2);"><button type="button" class="btn btn-secondary btn-sm">Discard</button><button type="button" class="btn btn-primary btn-sm">Save &amp; apply</button></div>
    </div>
  </div>
</div>
