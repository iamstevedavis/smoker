# Optional Mosquitto broker for local MQTT / Home Assistant testing.
#   docker compose -f docker-compose.yml -f docker-compose.mqtt.yml --profile mqtt up
# The bridge uses host networking, so it reaches the broker's published port on
# localhost.
services:
  pitboss-bridge:
    environment:
      PITBOSS_MQTT_HOST: localhost
  mosquitto:
    image: eclipse-mosquitto:2
    profiles: ["mqtt"]
    ports:
      - "1883:1883"
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
