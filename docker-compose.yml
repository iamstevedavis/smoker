# Default deployment: the WiFi (http) source with normal bridge networking.
# Copy .env.example to .env and set PITBOSS_HOST / PITBOSS_PASSWORD.
# Try it without a grill:  PITBOSS_SOURCE=fake docker compose up --build
services:
  smokestack:
    build:
      context: .
    image: ghcr.io/iamstevedavis/smokestack:latest
    restart: unless-stopped
    # Starts as root only so the entrypoint can hand /data back to `smokestack`
    # if docker-compose.ble.yml (which runs as `nobody`) used the volume last;
    # it drops root before the bridge starts.
    user: root
    env_file:
      - path: .env
        required: false
    environment:
      SMOKESTACK_RUN_AS: "10001:10001"
      PITBOSS_SOURCE: ${PITBOSS_SOURCE:-http}
      PITBOSS_MODEL: ${PITBOSS_MODEL:-PB850PS2}
      PITBOSS_HOST: ${PITBOSS_HOST:-}
      PITBOSS_PASSWORD: ${PITBOSS_PASSWORD:-}
      SMOKESTACK_DB: /data/smokestack.sqlite
      SMOKESTACK_POLL_SECONDS: ${SMOKESTACK_POLL_SECONDS:-2}
      SMOKESTACK_STALE_AFTER_SECONDS: ${SMOKESTACK_STALE_AFTER_SECONDS:-30}
    ports:
      - "${SMOKESTACK_PORT:-8000}:8000"
    volumes:
      - smokestack-data:/data

volumes:
  smokestack-data:
